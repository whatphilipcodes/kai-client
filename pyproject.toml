[project]
name = "kai-client"
version = "0.1.0"
description = "Local-only, process-per-stage speech-to-speech pipeline: UDP for audio, ZeroMQ for tokens"
requires-python = ">=3.15"
dependencies = [
  "httpx>=0.28",
  "pydantic-settings>=2.16.2",
  "pyzmq>=26",
  "sounddevice>=0.5",
  "tomli-w>=1.2.0",
  "uvloop>=0.23.0 ; sys_platform != 'win32'",
  "websockets>=13",
]

[project.scripts]
kai-client = "kai_client.main:main"

[dependency-groups]
dev = [
  "pytest>=9",
  "ruff>=0.17.3",
  "ty>=0.0.96",
]

[build-system]
requires = ["uv_build<0.14"]
build-backend = "uv_build"
